<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب | InterviewAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site/style/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="site/index.html">🎯 Interview<b>AI</b></a>
    <nav class="nav-links" id="nav-links"></nav>
  </header>

  <main>
    <section class="page-head">
      <h1>إنشاء حساب جديد</h1>
      <p>سجّل عشان تتدرّب وتحفظ نتايجك وتتابع تطورك</p>
    </section>

    <form class="card auth-card" id="auth-form" data-mode="register" novalidate>
      <div class="field">
        <label for="name">الاسم</label>
        <input id="name" name="name" type="text" maxlength="80" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور (6 حروف على الأقل)</label>
        <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="password2">تأكيد كلمة المرور</label>
        <input id="password2" name="password2" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div id="auth-error" class="alert error hidden" role="alert"></div>
      <button type="submit" class="btn block" id="auth-submit">إنشاء الحساب</button>
      <p class="switch-link">عندك حساب؟ <a href="site/login.html">سجّل دخولك</a></p>
    </form>
  </main>

  <footer class="footer">InterviewAI © 2026 | تدرّب قبل ما تدخل</footer>
  <script src="site/js/main.js"></script>
  <script src="site/js/auth.js"></script>
</body>
</html>
